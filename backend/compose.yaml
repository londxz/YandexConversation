name: razgovor-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: razgovor
      POSTGRES_USER: razgovor
      POSTGRES_PASSWORD: local-development-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razgovor -d razgovor"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://razgovor:local-development-password@postgres:5432/razgovor?sslmode=disable
      - up
    restart: "no"

  whisper:
    build:
      context: .
      dockerfile: deploy/whisper/Dockerfile
      args:
        WHISPER_CPP_VERSION: v1.9.1
        WHISPER_CPP_COMMIT: f049fff95a089aa9969deb009cdd4892b3e74916
        WHISPER_MODEL_SHA256: 60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      - "${SPEAKER_EMBEDDING_PORT:-8091}:8090"
    restart: unless-stopped

  speaker-embedder:
    build:
      context: .
      dockerfile: deploy/speaker-embedder/Dockerfile
      args:
        SHERPA_ONNX_VERSION: 1.13.4
        NUMPY_VERSION: 2.2.6
        SPEAKER_MODEL_SHA256: 98daf9bcf1c8abf3db374fec4c27a5eda7c58705bb3f180d057b085a72a88bb5
    init: true
    read_only: true
    environment:
      SPEAKER_EMBEDDING_THREADS: ${SPEAKER_EMBEDDING_THREADS:-2}
      SPEAKER_EMBEDDING_MAX_AUDIO_BYTES: ${SPEAKER_EMBEDDING_MAX_AUDIO_BYTES:-1048576}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        VERSION: local
        COMMIT: compose
        BUILD_TIME: local
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      whisper:
        condition: service_healthy
      speaker-embedder:
        condition: service_healthy
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://razgovor:local-development-password@postgres:5432/razgovor?sslmode=disable
      TOKEN_PEPPER_BASE64: bG9jYWwtdG9rZW4tcGVwcGVyLTMyLWJ5dGUtdmFsdWU=
      IDEMPOTENCY_ENCRYPTION_KEY_BASE64: bG9jYWwtaWRlbXBvdGVuY3ktMzItYnl0ZS12YWx1ZXM=
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 2160h
      IDEMPOTENCY_TTL: 24h
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-whisper}
      WHISPER_ENDPOINT: ${WHISPER_ENDPOINT:-http://whisper:8080/inference}
      SPEECH_RECOGNITION_TIMEOUT: ${SPEECH_RECOGNITION_TIMEOUT:-20s}
      SPEECH_MAX_AUDIO_BYTES: ${SPEECH_MAX_AUDIO_BYTES:-1048576}
      SPEECH_MAX_DURATION: ${SPEECH_MAX_DURATION:-30s}
      SPEECH_SUPPORTED_LANGUAGES: ${SPEECH_SUPPORTED_LANGUAGES:-ru-RU,en-US}
      SPEECH_MAX_CONCURRENT_REQUESTS: ${SPEECH_MAX_CONCURRENT_REQUESTS:-16}
      SPEECH_STREAM_PARTIAL_INTERVAL: ${SPEECH_STREAM_PARTIAL_INTERVAL:-2s}
      SPEECH_STREAM_SILENCE_DURATION: ${SPEECH_STREAM_SILENCE_DURATION:-800ms}
      SPEECH_STREAM_MAX_SEGMENT_DURATION: ${SPEECH_STREAM_MAX_SEGMENT_DURATION:-15s}
      SPEECH_STREAM_MAX_CHUNK_BYTES: ${SPEECH_STREAM_MAX_CHUNK_BYTES:-65536}
      SPEECH_STREAM_MAX_CONNECTIONS: ${SPEECH_STREAM_MAX_CONNECTIONS:-32}
      DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-sherpa}
      SPEAKER_EMBEDDING_ENDPOINT: ${SPEAKER_EMBEDDING_ENDPOINT:-http://speaker-embedder:8090/v1/embedding}
      DIARIZATION_TIMEOUT: ${DIARIZATION_TIMEOUT:-5s}
      DIARIZATION_MIN_AUDIO_DURATION: ${DIARIZATION_MIN_AUDIO_DURATION:-1s}
      DIARIZATION_SIMILARITY_THRESHOLD: ${DIARIZATION_SIMILARITY_THRESHOLD:-0.72}
      DIARIZATION_MAX_SPEAKERS: ${DIARIZATION_MAX_SPEAKERS:-8}
      DIARIZATION_MAX_CONCURRENT_REQUESTS: ${DIARIZATION_MAX_CONCURRENT_REQUESTS:-4}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
