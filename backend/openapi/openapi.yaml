openapi: 3.1.0
info:
  title: Razgovor API
  version: 1.0.0
  description: Production API contracts currently implemented by the Razgovor backend.
servers:
  - url: https://api.razgovor.app
  - url: http://127.0.0.1:8080
    description: Local development
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/devices/register:
    post:
      operationId: registerDevice
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Anonymous installation session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/devices/refresh:
    post:
      operationId: refreshDeviceSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshDeviceRequest"
      responses:
        "200":
          description: Both opaque session tokens rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/devices/{device_id}:
    delete:
      operationId: deleteDevice
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Device and associated server data deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/speech/transcribe:
    post:
      operationId: transcribeSpeech
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
                - language
              properties:
                file:
                  type: string
                  format: binary
                  description: PCM16, 16 kHz, mono WAV; at most 1 MiB PCM and 30 seconds.
                language:
                  type: string
                  enum:
                    - ru-RU
                    - en-US
                conversation_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Final transcription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechTranscription"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Audio exceeds the size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Request is not multipart/form-data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Audio format, duration, or language is unsupported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Recognition capacity is temporarily full.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Speech provider rejected the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          description: Speech provider timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/speech/stream:
    get:
      operationId: streamSpeech
      description: |
        Upgrades to an authenticated WebSocket. JSON client messages are
        `start`, ordered `audio_chunk`, and `stop`; server events are `ready`,
        `partial`, `final`, `error`, and `stopped`. Audio is PCM16, 16 kHz,
        mono and `audio_chunk.data` is base64 encoded.
      security:
        - bearerAuth: []
      x-websocket-client-messages:
        - start
        - audio_chunk
        - stop
      x-websocket-server-events:
        - ready
        - partial
        - final
        - error
        - stopped
      responses:
        "101":
          description: WebSocket protocol upgrade accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 100
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - time
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
        time:
          type: string
          format: date-time
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required:
        - platform
        - app_version
        - locale
      properties:
        platform:
          type: string
          const: ios
        app_version:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 35
    RefreshDeviceRequest:
      type: object
      additionalProperties: false
      required:
        - device_id
        - refresh_token
      properties:
        device_id:
          type: string
          format: uuid
        refresh_token:
          type: string
    DeviceSession:
      type: object
      additionalProperties: false
      required:
        - device_id
        - access_token
        - refresh_token
        - expires_at
      properties:
        device_id:
          type: string
          format: uuid
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time
    SpeechTranscription:
      type: object
      additionalProperties: false
      required:
        - text
        - language
        - duration_ms
      properties:
        text:
          type: string
        language:
          type: string
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        confidence:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
  responses:
    InvalidRequest:
      description: Request parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Device credentials are invalid or expired.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The authenticated device cannot access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdempotencyConflict:
      description: Idempotency-Key was reused for a different request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required backend dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
