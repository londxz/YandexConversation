name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "Contracts/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Contracts/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: razgovor_test
          POSTGRES_USER: razgovor
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U razgovor -d razgovor_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://razgovor:test-password@localhost:5432/razgovor_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Apply database migrations
        run: >-
          docker run --rm --network host
          -v "${{ github.workspace }}/backend/migrations:/migrations:ro"
          migrate/migrate:v4.19.1
          -path=/migrations
          -database="${TEST_DATABASE_URL}"
          up

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./...
