name: razgovor-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: razgovor
      POSTGRES_USER: razgovor
      POSTGRES_PASSWORD: local-development-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razgovor -d razgovor"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://razgovor:local-development-password@postgres:5432/razgovor?sslmode=disable
      - up
    restart: "no"

  api:
    build:
      context: .
      args:
        VERSION: local
        COMMIT: compose
        BUILD_TIME: local
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://razgovor:local-development-password@postgres:5432/razgovor?sslmode=disable
      TOKEN_PEPPER_BASE64: bG9jYWwtdG9rZW4tcGVwcGVyLTMyLWJ5dGUtdmFsdWU=
      IDEMPOTENCY_ENCRYPTION_KEY_BASE64: bG9jYWwtaWRlbXBvdGVuY3ktMzItYnl0ZS12YWx1ZXM=
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 2160h
      IDEMPOTENCY_TTL: 24h
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-disabled}
      SPEECH_RECOGNITION_TIMEOUT: ${SPEECH_RECOGNITION_TIMEOUT:-20s}
      SPEECH_MAX_AUDIO_BYTES: ${SPEECH_MAX_AUDIO_BYTES:-1048576}
      SPEECH_MAX_DURATION: ${SPEECH_MAX_DURATION:-30s}
      SPEECH_SUPPORTED_LANGUAGES: ${SPEECH_SUPPORTED_LANGUAGES:-ru-RU,en-US}
      SPEECH_MAX_CONCURRENT_REQUESTS: ${SPEECH_MAX_CONCURRENT_REQUESTS:-16}
      YANDEX_SPEECHKIT_ENDPOINT: ${YANDEX_SPEECHKIT_ENDPOINT:-https://stt.api.cloud.yandex.net/speech/v1/stt:recognize}
      YANDEX_SPEECHKIT_API_KEY: ${YANDEX_SPEECHKIT_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
